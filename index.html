<!doctype html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#e11d48">

<title>DODO WEIGHT</title>


<style>

/* ================================================= */
/* BASE */
/* ================================================= */

*{
    box-sizing:border-box;
}

:root{
    --rose:#e11d48;
    --rose-dark:#9f1239;
    --rose-soft:#fff1f2;
    --rose-border:#ffe4e6;
    --text:#27272a;
    --muted:#71717a;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:var(--rose-soft);
    color:var(--text);
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

button,
input,
textarea{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}


/* ================================================= */
/* APP */
/* ================================================= */

.app{
    max-width:680px;
    min-height:100vh;
    margin:auto;
    background:#fff;
    padding-bottom:82px;
}


/* ================================================= */
/* HEADER */
/* ================================================= */

header{
    position:sticky;
    top:0;
    z-index:10;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(10px);
    padding:18px 18px 10px;
    border-bottom:1px solid #fff;
}

.header-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.logo-title{
    font-family:Georgia,serif;
    font-size:25px;
    font-weight:700;
    color:var(--rose-dark);
}

.day-label{
    margin-top:3px;
    font-size:12px;
    color:var(--muted);
}

.day-buttons{
    display:flex;
    gap:6px;
}

.day-btn{
    width:36px;
    height:36px;
    border-radius:50%;
    background:var(--rose-soft);
    color:var(--rose-dark);
    font-size:20px;
}


/* ================================================= */
/* CONTENT */
/* ================================================= */

.content{
    padding:12px 15px 20px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}


/* ================================================= */
/* CARDS */
/* ================================================= */

.card{
    background:#fff;
    border:1px solid var(--rose-border);
    border-radius:18px;
    padding:15px;
    margin:11px 0;
    box-shadow:0 4px 18px rgba(0,0,0,.035);
}

.hero{
    background:linear-gradient(
        135deg,
        #fb7185,
        #fda4af
    );
    color:#fff;
    border:0;
}

.hero h2,
.hero p{
    color:#fff;
}

.hero h2{
    margin:0;
    font-family:Georgia,serif;
    font-size:22px;
}

.hero p{
    margin:5px 0 0;
    font-size:13px;
}


/* ================================================= */
/* SOUS ONGLETS */
/* ================================================= */

.subtabs{
    display:flex;
    gap:7px;
    margin:12px 0;
}

.subtab{
    flex:1;
    padding:9px 10px;
    border-radius:12px;
    background:var(--rose-soft);
    color:var(--rose-dark);
    font-size:13px;
    font-weight:600;
}

.subtab.active{
    background:var(--rose);
    color:#fff;
}


/* ================================================= */
/* SEMAINES */
/* ================================================= */

.week-tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:2px;
    margin:10px 0;
}

.week-tab{
    white-space:nowrap;
    padding:7px 12px;
    border-radius:999px;
    background:var(--rose-soft);
    color:var(--rose-dark);
    font-size:12px;
}

.week-tab.active{
    background:var(--rose);
    color:#fff;
}


/* ================================================= */
/* REPAS */
/* ================================================= */

.meal{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:11px 0;
    border-bottom:1px solid var(--rose-border);
}

.meal:last-child{
    border-bottom:0;
}

.meal-icon{
    width:28px;
    flex:none;
    font-size:18px;
}

.meal-info{
    flex:1;
}

.meal-title{
    font-size:12px;
    font-weight:700;
    color:var(--rose-dark);
    margin-bottom:3px;
}

.meal-text{
    font-size:13px;
    line-height:1.45;
}

.macro-note{
    margin-top:3px;
    font-size:11px;
    color:var(--muted);
}


/* ================================================= */
/* INTENSITE */
/* ================================================= */

.intensity{
    display:flex;
    align-items:center;
    gap:9px;
    padding:10px 12px;
    border-radius:13px;
    margin-top:10px;
    font-size:12px;
}

.intensity.green{
    background:#f0fdf4;
    color:#166534;
}

.intensity.orange{
    background:#fff7ed;
    color:#9a3412;
}

.intensity.red{
    background:#fff1f2;
    color:#9f1239;
}

.intensity-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:currentColor;
    flex:none;
}


/* ================================================= */
/* ACTIVITE */
/* ================================================= */

.activity-box{
    background:var(--rose-soft);
    border-radius:14px;
    padding:14px;
}

.activity-name{
    color:var(--rose-dark);
    font-weight:700;
    font-size:14px;
}

.activity-details{
    margin-top:5px;
    font-size:13px;
    line-height:1.5;
}


/* ================================================= */
/* INPUTS */
/* ================================================= */

label.small{
    display:block;
    color:var(--muted);
    font-size:12px;
    margin:10px 0 5px;
}

input,
textarea{
    width:100%;
    border:1px solid #fecdd3;
    border-radius:10px;
    background:#fff;
    padding:9px 10px;
    color:var(--text);
}

textarea{
    resize:vertical;
}

input:focus,
textarea:focus{
    outline:2px solid #fda4af;
    outline-offset:1px;
}


/* ================================================= */
/* COURSES */
/* ================================================= */

.shopping-summary{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--rose-soft);
    border-radius:14px;
    padding:11px 13px;
    font-size:12px;
    color:var(--rose-dark);
}

.clear-shopping{
    background:#fff;
    color:var(--rose-dark);
    border:1px solid var(--rose-border);
    border-radius:9px;
    padding:6px 9px;
    font-size:11px;
}

.shop-category{
    margin-top:16px;
}

.shop-category:first-child{
    margin-top:0;
}

.shop-category-title{
    font-size:14px;
    font-weight:700;
    color:var(--rose-dark);
    margin-bottom:7px;
}

.shop-item{
    display:flex;
    align-items:center;
    gap:9px;
    padding:8px 0;
    border-bottom:1px solid #fff1f2;
}

.shop-item:last-child{
    border-bottom:0;
}

.shop-item input{
    width:18px;
    height:18px;
    accent-color:var(--rose);
    flex:none;
}

.shop-name{
    flex:1;
    font-size:13px;
}

.shop-quantity{
    color:var(--muted);
    font-size:11px;
    white-space:nowrap;
}


/* ================================================= */
/* POIDS */
/* ================================================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin:12px 0;
}

.stat{
    background:var(--rose-soft);
    border-radius:14px;
    padding:12px 7px;
    text-align:center;
}

.stat strong{
    color:var(--rose-dark);
    font-size:19px;
}

.stat span{
    display:block;
    margin-top:2px;
    color:var(--muted);
    font-size:10px;
}

.progress-bg{
    width:100%;
    height:9px;
    background:var(--rose-border);
    border-radius:999px;
    overflow:hidden;
}

.progress{
    height:100%;
    width:0;
    background:var(--rose);
    border-radius:999px;
    transition:.3s;
}

.progress-labels{
    display:flex;
    justify-content:space-between;
    color:var(--muted);
    font-size:11px;
    margin-bottom:6px;
}


/* ================================================= */
/* COURBE */
/* ================================================= */

.chart-wrap{
    width:100%;
    overflow:hidden;
}

#weightChart{
    width:100%;
    height:auto;
    display:block;
}

.chart-line{
    fill:none;
    stroke:var(--rose);
    stroke-width:3;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.chart-point{
    fill:#fff;
    stroke:var(--rose);
    stroke-width:3;
}

.chart-grid{
    stroke:#ffe4e6;
    stroke-width:1;
}

.chart-label{
    fill:#a1a1aa;
    font-size:11px;
    font-family:system-ui,sans-serif;
}

.chart-empty{
    fill:#a1a1aa;
    font-size:13px;
    font-family:system-ui,sans-serif;
}


/* ================================================= */
/* HISTORIQUE */
/* ================================================= */

.history-row{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid var(--rose-border);
    font-size:13px;
}

.history-row:last-child{
    border-bottom:0;
}

.history-row span{
    color:var(--muted);
}

.history-row b{
    color:var(--rose-dark);
}


/* ================================================= */
/* PRIERES */
/* ================================================= */

.prayers{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.prayer{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--rose-soft);
    padding:10px;
    border-radius:11px;
    font-size:12px;
}

.prayer input{
    width:17px;
    height:17px;
    accent-color:var(--rose);
}


/* ================================================= */
/* HUMEUR */
/* ================================================= */

.moods{
    display:flex;
    justify-content:space-around;
    margin-top:8px;
}

.mood{
    background:none;
    font-size:27px;
    opacity:.3;
    padding:5px;
    transition:.15s;
}

.mood.selected{
    opacity:1;
    transform:scale(1.12);
}


/* ================================================= */
/* NAVIGATION BAS */
/* ================================================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);

    width:100%;
    max-width:680px;

    height:72px;

    display:grid;
    grid-template-columns:repeat(4,1fr);

    background:rgba(255,255,255,.97);
    backdrop-filter:blur(12px);

    border-top:1px solid var(--rose-border);

    padding-bottom:env(safe-area-inset-bottom);

    z-index:30;
}

.bottom-nav button{
    background:none;
    color:#71717a;
    font-size:10px;
}

.bottom-nav button span{
    display:block;
    font-size:21px;
    margin-bottom:2px;
}

.bottom-nav button.active{
    color:var(--rose);
    font-weight:700;
}


/* ================================================= */
/* CONFIGURATION */
/* ================================================= */

.setup{
    min-height:100vh;
    background:#fff;
    padding:30px 18px;
}

.setup-box{
    max-width:520px;
    margin:auto;
}

.setup-logo{
    text-align:center;
    font-size:58px;
    margin:20px 0 8px;
}

.setup-title{
    text-align:center;
    font-family:Georgia,serif;
    color:var(--rose-dark);
    font-size:28px;
}

.setup-subtitle{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    margin:7px 0 22px;
}

.setup-card{
    background:#fff;
    border:1px solid var(--rose-border);
    border-radius:20px;
    padding:18px;
    box-shadow:0 5px 25px rgba(0,0,0,.04);
}

.field{
    margin-bottom:14px;
}

.field label{
    display:block;
    color:var(--muted);
    font-size:12px;
    margin-bottom:5px;
}

.primary{
    width:100%;
    padding:12px;
    background:var(--rose);
    color:#fff;
    border-radius:12px;
    font-weight:700;
}


/* ================================================= */
/* RESPONSIVE */
/* ================================================= */

@media(max-width:480px){

    .content{
        padding-left:12px;
        padding-right:12px;
    }

    .card{
        padding:14px;
    }

    .meal-text{
        font-size:12px;
    }

    .stats{
        gap:5px;
    }

    .bottom-nav{
        height:70px;
    }

}

</style>

</head>


<body>


<!-- ================================================= */
/* CONFIGURATION */
/* ================================================= -->

<div
    id="setup"
    class="setup"
>

    <div class="setup-box">

        <div class="setup-logo">
            🌷
        </div>

        <div class="setup-title">
            DODO WEIGHT
        </div>

        <div class="setup-subtitle">
            Un petit pas chaque jour. 🤍
        </div>


        <div class="setup-card">


            <div class="field">

                <label>
                    Mon objectif
                </label>

                <input
                    id="sGoal"
                    placeholder="Ex. perdre 10 kg"
                >

            </div>


            <div class="field">

                <label>
                    Poids de départ
                </label>

                <input
                    id="sStart"
                    type="number"
                    step="0.1"
                    placeholder="Ex. 75"
                >

            </div>


            <div class="field">

                <label>
                    Poids objectif
                </label>

                <input
                    id="sTarget"
                    type="number"
                    step="0.1"
                    placeholder="Ex. 65"
                >

            </div>


            <div class="field">

                <label>
                    Date de départ
                </label>

                <input
                    id="sDate"
                    type="date"
                >

            </div>


            <button
                class="primary"
                onclick="finishSetup()"
            >
                Commencer 🌷
            </button>


        </div>

    </div>

</div>



<!-- ================================================= */
/* APPLICATION */
/* ================================================= -->

<div
    id="app"
    class="app"
    style="display:none"
>


<header>

    <div class="header-row">

        <div>

            <div class="logo-title">
                DODO WEIGHT
            </div>

            <div
                id="dateLabel"
                class="day-label"
            ></div>

        </div>


        <div class="day-buttons">

            <button
                class="day-btn"
                onclick="changeDay(-1)"
            >
                ‹
            </button>

            <button
                class="day-btn"
                onclick="changeDay(1)"
            >
                ›
            </button>

        </div>

    </div>

</header>



<main class="content">


<!-- ================================================= */
/* ALIMENTATION */
/* ================================================= -->

<section
    id="food"
    class="page active"
>


    <div class="card hero">

        <h2>
            🍽️ Alimentation
        </h2>

        <p id="foodGoal">
            Mon objectif
        </p>

    </div>


    <div class="subtabs">

        <button
            id="menuTab"
            class="subtab active"
            onclick="showFoodSection('menus')"
        >
            🍽️ Menus
        </button>


        <button
            id="shoppingTab"
            class="subtab"
            onclick="showFoodSection('shopping')"
        >
            🛒 Courses
        </button>

    </div>



    <!-- MENUS -->

    <div id="menusSection">


        <div
            id="weekTabs"
            class="week-tabs"
        ></div>


        <div class="card">

            <h3>
                Repas du jour
            </h3>


            <div
                id="meals"
            ></div>


            <div
                id="dayIntensity"
            ></div>

        </div>


        <div class="card">

            <h3>
                💧 Hydratation
            </h3>


            <label class="small">
                Nombre de verres
            </label>


            <input
                id="water"
                type="number"
                min="0"
                placeholder="0"
            >

        </div>


    </div>



    <!-- COURSES -->

    <div
        id="shoppingSection"
        style="display:none"
    >


        <div class="week-tabs">

            <button
                class="week-tab active"
                id="shopWeek0"
                onclick="setShoppingWeek(0)"
            >
                Semaine 1
            </button>

            <button
                class="week-tab"
                id="shopWeek1"
                onclick="setShoppingWeek(1)"
            >
                Semaine 2
            </button>

            <button
                class="week-tab"
                id="shopWeek2"
                onclick="setShoppingWeek(2)"
            >
                Semaine 3
            </button>

            <button
                class="week-tab"
                id="shopWeek3"
                onclick="setShoppingWeek(3)"
            >
                Semaine 4
            </button>

        </div>


        <div class="shopping-summary">

            <span id="shoppingCount">
                0 produit coché
            </span>

            <button
                class="clear-shopping"
                onclick="clearShopping()"
            >
                Tout décocher
            </button>

        </div>


        <div
            id="shoppingList"
            class="card"
        ></div>


    </div>


</section>



<!-- ================================================= */
/* ACTIVITE */
/* ================================================= */

<section
    id="activityPage"
    class="page"
>


    <div class="card hero">

        <h2>
            🏃 Activité
        </h2>

        <p id="activityDay"></p>

    </div>


    <div class="card">

        <h3>
            Activité du jour
        </h3>


        <div
            id="activityBox"
            class="activity-box"
        >

            <div
                id="activityName"
                class="activity-name"
            ></div>

            <div
                id="activityDetails"
                class="activity-details"
            ></div>

        </div>


        <div
            id="activityIntensity"
        ></div>

    </div>


    <div class="card">

        <h3>
            Activité réalisée
        </h3>


        <label class="small">
            Durée réellement réalisée
        </label>


        <input
            id="activityMinutes"
            type="number"
            min="0"
            placeholder="Ex. 30"
        >


        <label class="small">
            Notes
        </label>


        <textarea
            id="activityNotes"
            rows="3"
            placeholder="Comment s'est passée ma séance ?"
        ></textarea>

    </div>


</section>



<!-- ================================================= */
/* POIDS */
/* ================================================= */

<section
    id="weightPage"
    class="page"
>


    <div class="card hero">

        <h2>
            ⚖️ Mon poids
        </h2>

        <p>
            Ma progression, sans pression.
        </p>

    </div>


    <div class="stats">


        <div class="stat">

            <strong id="startStat">
                —
            </strong>

            <span>
                Départ
            </span>

        </div>


        <div class="stat">

            <strong id="currentStat">
                —
            </strong>

            <span>
                Actuel
            </span>

        </div>


        <div class="stat">

            <strong id="leftStat">
                —
            </strong>

            <span>
                Restant
            </span>

        </div>


    </div>


    <div class="card">

        <h3>
            🎯 Progression
        </h3>


        <div class="progress-labels">

            <span id="startText">
                —
            </span>

            <span id="targetText">
                —
            </span>

        </div>


        <div class="progress-bg">

            <div
                id="progress"
                class="progress"
            ></div>

        </div>


        <div
            id="progressText"
            style="
            color:#71717a;
            font-size:11px;
            margin-top:7px;
            "
        ></div>

    </div>


    <div class="card">

        <h3>
            📉 Évolution
        </h3>


        <div class="chart-wrap">

            <svg
                id="weightChart"
                viewBox="0 0 600 250"
                preserveAspectRatio="xMidYMid meet"
            ></svg>

        </div>

    </div>


    <div class="card">

        <h3>
            Pesée du jour
        </h3>


        <label class="small">
            Poids en kg
        </label>


        <input
            id="weight"
            type="number"
            step="0.1"
            placeholder="Ex. 74.8"
        >

    </div>


    <div class="card">

        <h3>
            📋 Historique
        </h3>


        <div
            id="history"
        ></div>

    </div>


</section>



<!-- ================================================= */
/* MOI */
/* ================================================= */

<section
    id="mePage"
    class="page"
>


    <div class="card hero">

        <h2>
            🤍 Moi
        </h2>

        <p>
            Mon bien-être au quotidien.
        </p>

    </div>


    <div class="card">

        <h3>
            🕌 Mes prières
        </h3>


        <div
            id="prayers"
            class="prayers"
        ></div>

    </div>


    <div class="card">

        <h3>
            😊 Mon humeur
        </h3>


        <div class="moods">


            <button
                class="mood"
                data-mood="1"
            >
                😔
            </button>


            <button
                class="mood"
                data-mood="2"
            >
                😐
            </button>


            <button
                class="mood"
                data-mood="3"
            >
                🙂
            </button>


            <button
                class="mood"
                data-mood="4"
            >
                😊
            </button>


            <button
                class="mood"
                data-mood="5"
            >
                🤍
            </button>


        </div>

    </div>


    <div class="card">

        <h3>
            😴 Mon sommeil
        </h3>


        <input
            id="sleep"
            type="number"
            step="0.5"
            placeholder="Nombre d'heures"
        >

    </div>


    <div class="card">

        <h3>
            📝 Mon ressenti
        </h3>


        <textarea
            id="feeling"
            rows="4"
            placeholder="Comment je me sens aujourd'hui ?"
        ></textarea>


        <label class="small">
            ✨ Ma victoire du jour
        </label>


        <textarea
            id="victory"
            rows="3"
            placeholder="Une petite victoire, même minime."
        ></textarea>

    </div>


</section>


</main>



<!-- ================================================= */
/* NAVIGATION */
/* ================================================= */

<nav class="bottom-nav">


    <button
        class="active"
        data-page="food"

function newDay(){

    return {

        weight:'',
        water:'',

        activityMinutes:'',
        activityNotes:'',

        prayers:[
            false,
            false,
            false,
            false,
            false
        ],

        mood:0,

        sleep:'',
        feeling:'',
        victory:''

    };

}


let data =

JSON.parse(
    localStorage.getItem('dodoWeight')
    ||
    'null'
)

||

{

    setup:{
        goal:'',
        start:'',
        target:'',
        date:''
    },

    days:Array.from(
        {length:28},
        newDay
    ),

    day:0,

    shopping:[
        [],
        [],
        [],
        []
    ]

};


let shoppingWeek = 0;



/* ================================================= */
/* SAUVEGARDE */
/* ================================================= */


function save(){

    localStorage.setItem(
        'dodoWeight',
        JSON.stringify(data)
    );

}



/* ================================================= */
/* CONFIGURATION */
/* ================================================= */


function finishSetup(){

    data.setup.goal =
        document
        .getElementById('sGoal')
        .value;


    data.setup.start =
        document
        .getElementById('sStart')
        .value;


    data.setup.target =
        document
        .getElementById('sTarget')
        .value;


    data.setup.date =
        document
        .getElementById('sDate')
        .value;


    save();

    showApp();

}



function showApp(){

    document
        .getElementById('setup')
        .style.display='none';


    document
        .getElementById('app')
        .style.display='block';


    renderAll();

}



/* ================================================= */
/* JOUR */
/* ================================================= */


function changeDay(direction){

    saveInputs();

    data.day =
        Math.max(
            0,
            Math.min(
                27,
                data.day + direction
            )
        );

    renderAll();

    save();

}



/* ================================================= */
/* SOUS ONGLETS ALIMENTATION */
/* ================================================= */


function showFoodSection(section){

    const menus =
        document.getElementById(
            'menusSection'
        );

    const shopping =
        document.getElementById(
            'shoppingSection'
        );


    const menuTab =
        document.getElementById(
            'menuTab'
        );

    const shoppingTab =
        document.getElementById(
            'shoppingTab'
        );


    if(section === 'menus'){

        menus.style.display='block';

        shopping.style.display='none';

        menuTab.classList.add(
            'active'
        );

        shoppingTab.classList.remove(
            'active'
        );

    }

    else{

        menus.style.display='none';

        shopping.style.display='block';

        menuTab.classList.remove(
            'active'
        );

        shoppingTab.classList.add(
            'active'
        );

        renderShopping();

    }

}



/* ================================================= */
/* SEMAINE MENU */
/* ================================================= */


function goWeek(week){

    saveInputs();

    data.day =
        week * 7;

    renderAll();

    save();

}



/* ================================================= */
/* RENDU GENERAL */
/* ================================================= */


function renderAll(){

    const d =
        data.day;


    const week =
        Math.floor(
            d / 7
        );


    const dow =
        d % 7;


    const state =
        data.days[d];


    document
        .getElementById('dateLabel')
        .textContent =
        `Semaine ${week+1} • ${DAYS[dow]} • Jour ${d+1}`;


    document
        .getElementById('foodGoal')
        .textContent =
        data.setup.goal
        ||
        'Mon objectif du jour';


    document
        .getElementById('activityDay')
        .textContent =
        `${DAYS[dow]} • Semaine ${week+1}`;



    renderMeals(
        week,
        dow
    );


    renderActivity(
        week,
        dow
    );


    renderPrayers(
        state
    );


    renderInputs(
        state
    );


    renderWeight();


    renderShopping();

}



/* ================================================= */
/* MENUS */
/* ================================================= */


function renderMeals(
    week,
    dow
){

    const day =
        MEALS[week][dow];


    const labels = [

        ['🌅','Petit-déjeuner'],
        ['🍽️','Déjeuner'],
        ['🍎','Collation'],
        ['🌙','Dîner']

    ];


    document
        .getElementById('meals')
        .innerHTML =


        day

        .slice(
            0,
            4
        )

        .map(

            (meal,index) =>

            `

            <div class="meal">

                <div class="meal-icon">
                    ${labels[index][0]}
                </div>

                <div class="meal-info">

                    <div class="meal-title">
                        ${labels[index][1]}
                    </div>

                    <div class="meal-text">
                        ${meal}
                    </div>

                </div>

            </div>

            `

        )

        .join('');


    const intensity =
        day.i;


    const intensityData = {

        green:{
            label:'🟢 Journée légère',
            text:'Glucides réduits : priorité aux protéines et légumes.',
            class:'green'
        },

        orange:{
            label:'🟠 Journée modérée',
            text:'Glucides modérés pour accompagner l’activité.',
            class:'orange'
        },

        red:{
            label:'🔴 Journée intense',
            text:'Glucides légèrement augmentés pour soutenir l’entraînement.',
            class:'red'
        }

    };


    const info =
        intensityData[intensity];


    document
        .getElementById('dayIntensity')
        .innerHTML =

        `

        <div class="intensity ${info.class}">

            <span class="intensity-dot"></span>

            <span>
                <strong>
                    ${info.label}
                </strong>
                <br>
                ${info.text}
            </span>

        </div>

        `;


    document
        .getElementById('weekTabs')
        .innerHTML =

        [0,1,2,3]

        .map(

            index =>

            `

            <button
                class="week-tab ${index===week?'active':''}"
                onclick="goWeek(${index})"
            >
                Semaine ${index+1}
            </button>

            `

        )

        .join('');

}

function setShoppingWeek(week){

    shoppingWeek =
        week;


    for(
        let i=0;
        i<4;
        i++
    ){

        document
            .getElementById(
                'shopWeek'+i
            )
            .classList.toggle(
                'active',
                i===week
            );

    }


    renderShopping();

}



function shoppingKey(
    week,
    category,
    index
){

    return `${week}_${category}_${index}`;

}



function renderShopping(){

    const container =
        document.getElementById(
            'shoppingList'
        );


    if(!container){
        return;
    }


    const selected =
        data.shopping[
            shoppingWeek
        ]
        ||
        [];


    let count =
        selected.length;


    document
        .getElementById(
            'shoppingCount'
        )
        .textContent =

        count === 0

        ?

        '0 produit coché'

        :

        `${count} produit${count>1?'s':''} coché${count>1?'s':''}`;


    container.innerHTML =

        SHOPPING[shoppingWeek]

        .map(

            (category,categoryIndex) =>

            `

            <div class="shop-category">

                <div class="shop-category-title">
                    ${category.category}
                </div>


                ${

                category.items

                .map(

                    (item,index) => {

                        const key =
                            shoppingKey(
                                shoppingWeek,
                                categoryIndex,
                                index
                            );


                        const checked =
                            selected.includes(
                                key
                            );


                        return `

                        <label class="shop-item">

                            <input
                                type="checkbox"
                                ${checked?'checked':''}
                                onchange="
                                    toggleShopping(
                                        '${key}'
                                    )
                                "
                            >

                            <span class="shop-name">
                                ${item[0]}
                            </span>

                            <span class="shop-quantity">
                                ${item[1]}
                            </span>

                        </label>

                        `;

                    }

                )

                .join('')

                }

            </div>

            `

        )

        .join('');

}



function toggleShopping(key){

    if(
        !data.shopping[shoppingWeek]
    ){

        data.shopping[shoppingWeek] =
            [];

    }


    const list =
        data.shopping[
            shoppingWeek
        ];


    const index =
        list.indexOf(
            key
        );


    if(index >= 0){

        list.splice(
            index,
            1
        );

    }

    else{

        list.push(
            key
        );

    }


    save();

    renderShopping();

}



function clearShopping(){

    data.shopping[
        shoppingWeek
    ] = [];


    save();

    renderShopping();

}



/* ================================================= */
/* COURBE DE POIDS */
/* ================================================= */


function renderWeightChart(){

    const svg =
        document.getElementById(
            'weightChart'
        );


    if(!svg){
        return;
    }


    const weights =

        data.days

        .map(

            (day,index) => ({

                day:index+1,

                value:
                    parseFloat(
                        day.weight
                    )

            })

        )

        .filter(

            item =>
            Number.isFinite(
                item.value
            )

        );


    svg.innerHTML='';


    if(
        weights.length === 0
    ){

        svg.innerHTML =

        `

        <text
            x="300"
            y="130"
            text-anchor="middle"
            class="chart-empty"
        >
            Ajoute une pesée pour voir ta progression
        </text>

        `;

        return;

    }


    const width = 600;

    const height = 250;

    const left = 45;

    const right = 18;

    const top = 18;

    const bottom = 35;


    const chartWidth =
        width-left-right;


    const chartHeight =
        height-top-bottom;


    let min =
        Math.min(
            ...weights.map(
                x=>x.value
            )
        );


    let max =
        Math.max(
            ...weights.map(
                x=>x.value
            )
        );


    if(
        min === max
    ){

        min -= 1;

        max += 1;

    }

    else{

        min -= .5;

        max += .5;

    }


    function x(index){

        if(
            weights.length === 1
        ){

            return left +
                chartWidth/2;

        }


        return left +

            (
                index /
                (weights.length-1)
            )

            *
            chartWidth;

    }


    function y(value){

        return top +

            (
                (max-value)
                /
                (max-min)
            )

            *
            chartHeight;

    }


    /* grille très légère */

    for(
        let i=0;
        i<=2;
        i++
    ){

        const yy =
            top +
            (i/2)
            *
            chartHeight;


        const value =
            max -
            (
                (max-min)
                *
                (i/2)
            );


        svg.innerHTML +=

        `

        <line
            x1="${left}"
            y1="${yy}"
            x2="${width-right}"
            y2="${yy}"
            class="chart-grid"
        />

        <text
            x="${left-7}"
            y="${yy+4}"
            text-anchor="end"
            class="chart-label"
        >
            ${value.toFixed(1)}
        </text>

        `;

    }


    let points='';


    weights.forEach(

        (item,index)=>{

            points +=

                `${x(index)},${y(item.value)} `;

        }

    );


    if(
        weights.length > 1
    ){

        svg.innerHTML +=

        `

        <polyline
            points="${points}"
            class="chart-line"
        />

        `;

    }


    weights.forEach(

        (item,index)=>{

            const xx =
                x(index);


            const yy =
                y(item.value);


            svg.innerHTML +=

            `

            <circle
                cx="${xx}"
                cy="${yy}"
                r="5"
                class="chart-point"
            />

            <text
                x="${xx}"
                y="${height-10}"
                text-anchor="middle"
                class="chart-label"
            >
                J${item.day}
            </text>

            `;

        }

    );

}



/* ================================================= */
/* POIDS */
/* ================================================= */


function renderWeight(){

    const start =
        parseFloat(
            data.setup.start
        );


    const target =
        parseFloat(
            data.setup.target
        );


    const weights =

        data.days

        .map(

            (day,index)=>({

                index,

                value:
                    parseFloat(
                        day.weight
                    )

            })

        )

        .filter(

            item =>
            Number.isFinite(
                item.value
            )

        );


    const current =

        weights.length

        ?

        weights[
            weights.length-1
        ].value

        :

        start;


    let remaining = null;


    if(
        Number.isFinite(target)
        &&
        Number.isFinite(current)
    ){

        remaining =
            Math.max(
                0,
                current-target
            );

    }


    let progress=0;


    if(
        Number.isFinite(start)
        &&
        Number.isFinite(target)
        &&
        start !== target
    ){

        progress =

            (
                (start-current)
                /
                (start-target)
            )
            *
            100;


        progress =
            Math.max(
                0,
                Math.min(
                    100,
                    progress
                )
            );

    }


    document
        .getElementById('startStat')
        .textContent =

        Number.isFinite(start)

        ?

        start.toFixed(1)

        :

        '—';


    document
        .getElementById('currentStat')
        .textContent =

        Number.isFinite(current)

        ?

        current.toFixed(1)

        :

        '—';


    document
        .getElementById('leftStat')
        .textContent =

        remaining !== null

        ?

        remaining.toFixed(1)

        :

        '—';


    document
        .getElementById('startText')
        .textContent =

        Number.isFinite(start)

        ?

        start.toFixed(1)+' kg'

        :

        'Départ';


    document
        .getElementById('targetText')
        .textContent =

        Number.isFinite(target)

        ?

        target.toFixed(1)+' kg'

        :

        'Objectif';


    document
        .getElementById('progress')
        .style.width =
        progress+'%';


    if(
        Number.isFinite(current)
        &&
        Number.isFinite(start)
    ){

        const lost =
            start-current;


        document
            .getElementById('progressText')
            .textContent =

            lost >= 0

            ?

            `${lost.toFixed(1)} kg perdus • ${progress.toFixed(0)} % de l'objectif`

            :

            `+${Math.abs(lost).toFixed(1)} kg depuis le départ`;

    }

    else{

        document
            .getElementById('progressText')
            .textContent =
            'Ajoute une pesée pour suivre ta progression.';

    }


    /* historique */

    if(
        weights.length === 0
    ){

        document
            .getElementById('history')
            .innerHTML =

            `

            <div class="history-row">

                <span>
                    Aucune pesée
                </span>

                <b>
                    —
                </b>

            </div>

            `;

    }

    else{

        document
            .getElementById('history')
            .innerHTML =

            weights

            .slice()
            .reverse()

            .map(

                item =>

                `

                <div class="history-row">

                    <span>
                        Jour ${item.index+1}
                    </span>

                    <b>
                        ${item.value.toFixed(1)} kg
                    </b>

                </div>

                `

            )

            .join('');

    }


    renderWeightChart();

}
